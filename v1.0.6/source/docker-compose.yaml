services:
  reader:
    image: ghcr.io/mysecret2022/reader:dev
    container_name: reader
    restart: always
    ports:
      - "8080:8080" # 外部访问端口，按需调整
    volumes:
      - ./storage:/storage # 数据持久化目录（书源、书架、缓存及配置）
      - ./logs:/app/logs   # 日志输出目录（与管理后台诊断日志实时互通）
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
